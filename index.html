<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV Viewer Online</title>
  <meta name="description" content="Free online CSV viewer. Upload and view your CSV files instantly in your browser.">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
    h1 { color: #333; }
    #output { margin-top: 20px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
    input[type="file"] { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>CSV Viewer Online</h1>
  <p>Select a CSV file to view:</p>
  <input type="file" id="csvFile" accept=".csv" />
  <div id="output"></div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    document.getElementById('csvFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const data = results.data;
          if (data.length === 0) {
            document.getElementById('output').innerHTML = '<p>No data found.</p>';
            return;
          }

          const table = document.createElement('table');
          const thead = document.createElement('thead');
          const tbody = document.createElement('tbody');

          // Headers
          const headers = Object.keys(data[0]);
          const trHead = document.createElement('tr');
          headers.forEach(header => {
            const th = document.createElement('th');
            th.textContent = header;
            trHead.appendChild(th);
          });
          thead.appendChild(trHead);

          // Rows
          data.forEach(row => {
            const tr = document.createElement('tr');
            headers.forEach(header => {
              const td = document.createElement('td');
              td.textContent = row[header];
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });

          table.appendChild(thead);
          table.appendChild(tbody);
          const output = document.getElementById('output');
          output.innerHTML = '';
          output.appendChild(table);
        }
      });
    });
  </script>
</body>
</html>
