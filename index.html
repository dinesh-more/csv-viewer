<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Viewer & Editor</title>
  <meta name="description" content="Modern CSV Viewer and Editor - Upload, Edit, Export CSV files online.">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .dark-mode { background-color: #1f2937; color: #f9fafb; }
    .dark-mode table { color: #f9fafb; }
    .dark-mode .bg-white { background-color: #374151 !important; }
    .changed-cell { background-color: #fcd34d; }
    .hidden { display: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-6 transition-colors" id="body">
  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-semibold text-center w-full">CSV Viewer & Editor</h1>
<!--       <button id="toggleTheme" class="absolute top-6 right-6 bg-gray-700 text-white px-3 py-1 rounded">Toggle Theme</button> -->
      <button id="toggleTheme" class="absolute top-6 right-6 bg-gray-700 text-white px-2 py-1 text-xs rounded-full shadow hover:bg-gray-600 transition-all">🌓</button>
    </div>

    <div class="flex flex-wrap gap-4 justify-center mb-6">
      <input type="file" id="csvFile" accept=".csv" class="block p-2 border rounded" />
      <input type="text" id="csvUrl" placeholder="Import CSV from URL" class="block p-2 border rounded w-64" />
      <button id="loadUrl" class="bg-yellow-600 text-white px-4 py-2 rounded hover:bg-yellow-700">Load URL</button>
      <input type="text" id="searchInput" placeholder="Search..." class="block p-2 border rounded w-64" />
    </div>

    <div class="flex gap-4 justify-center mb-6 hidden" id="actionButtons">
      <button id="downloadCsv" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Download CSV</button>
      <div class="relative">
        <button id="exportBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Export ▼</button>
        <div id="exportMenu" class="absolute hidden mt-2 w-32 bg-white border rounded shadow-lg z-10">
          <button id="exportJson" class="block w-full text-left px-4 py-2 hover:bg-gray-100">Export JSON</button>
          <button id="exportXlsx" class="block w-full text-left px-4 py-2 hover:bg-gray-100">Export XLSX</button>
          <button id="exportPdf" class="block w-full text-left px-4 py-2 hover:bg-gray-100">Export PDF</button>
        </div>
      </div>
      <button id="addRow" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Add Row</button>
      <button id="addColumn" class="bg-pink-600 text-white px-4 py-2 rounded hover:bg-pink-700">Add Column</button>
    </div>

    <div id="dropZone" class="p-4 mb-4 text-center border-2 border-dashed rounded-lg border-gray-400 bg-white text-gray-500">Drag & Drop CSV File Here</div>
    <div id="tableContainer" class="overflow-x-auto bg-white shadow rounded p-4 mb-6"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    let csvData = [], originalData = [];

    function showActions() {
      document.getElementById('actionButtons').classList.remove('hidden');
    }

    function saveToLocal() {
      localStorage.setItem('csvDraft', JSON.stringify(csvData));
    }

    function loadFromLocal() {
      const saved = localStorage.getItem('csvDraft');
      if (saved) {
        csvData = JSON.parse(saved);
        originalData = JSON.parse(saved);
        renderTable(csvData);
        showActions();
      }
    }

    function filterData(query) {
      const filtered = csvData.filter(row =>
        Object.values(row).some(val => val && val.toString().toLowerCase().includes(query.toLowerCase()))
      );
      renderTable(filtered);
    }

    document.getElementById('csvFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          csvData = results.data;
          originalData = JSON.parse(JSON.stringify(results.data));
          renderTable(csvData);
          saveToLocal();
          showActions();
        }
      });
    });

    document.getElementById('loadUrl').addEventListener('click', () => {
      const url = document.getElementById('csvUrl').value;
      if (!url) return;
      fetch(url)
        .then(res => res.text())
        .then(text => {
          Papa.parse(text, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
              csvData = results.data;
              originalData = JSON.parse(JSON.stringify(results.data));
              renderTable(csvData);
              saveToLocal();
              showActions();
            }
          });
        });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      filterData(e.target.value);
    });

    function renderTable(data) {
      if (!data.length) return;
      const headers = Object.keys(data[0]);
      let html = '<table class="min-w-full border text-sm">';
      html += '<thead><tr>' + headers.map(h => `<th class="border p-2 bg-gray-100 cursor-pointer" onclick="sortBy('${h}')">${h}</th>`).join('') + '<th class="border p-2 bg-gray-100">Actions</th></tr></thead>';
      html += '<tbody>';
      data.forEach((row, rowIndex) => {
        html += '<tr>' + headers.map(h => {
          const changed = originalData[rowIndex]?.[h] !== row[h];
          return `<td contenteditable="true" data-row="${rowIndex}" data-key="${h}" class="border p-2 ${changed ? 'changed-cell' : ''}">${row[h] || ''}</td>`;
        }).join('') + `<td class="border p-2 text-center"><button onclick="deleteRow(${rowIndex})" class="text-red-600 hover:underline">Delete</button></td></tr>`;
      });
      html += '</tbody></table>';
      document.getElementById('tableContainer').innerHTML = html;

      document.querySelectorAll('td[contenteditable=true]').forEach(td => {
        td.addEventListener('input', (e) => {
        const row = e.target.getAttribute('data-row');
        const key = e.target.getAttribute('data-key');
        csvData[row][key] = e.target.textContent;
        e.target.classList.add('changed-cell');
        saveToLocal();
        });
      });
    }

    let sortAsc = true;
    function sortBy(key) {
      csvData.sort((a, b) => {
        if (a[key] < b[key]) return sortAsc ? -1 : 1;
        if (a[key] > b[key]) return sortAsc ? 1 : -1;
        return 0;
      });
      sortAsc = !sortAsc;
      renderTable(csvData);
      saveToLocal();
    }

    function deleteRow(index) {
      csvData.splice(index, 1);
      renderTable(csvData);
      saveToLocal();
    }

    document.getElementById('addRow').addEventListener('click', () => {
      if (!csvData.length) return;
      const newRow = {};
      Object.keys(csvData[0]).forEach(key => newRow[key] = '');
      csvData.push(newRow);
      renderTable(csvData);
      saveToLocal();
    });

    document.getElementById('addColumn').addEventListener('click', () => {
      if (!csvData.length) return;
      const newCol = prompt("Enter new column name:");
      if (!newCol) return;
      csvData.forEach(row => row[newCol] = '');
      renderTable(csvData);
      saveToLocal();
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('bg-gray-200');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-gray-200'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('bg-gray-200');
      const file = e.dataTransfer.files[0];
      if (!file) return;
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          csvData = results.data;
          originalData = JSON.parse(JSON.stringify(results.data));
          renderTable(csvData);
          saveToLocal();
          showActions();
        }
      });
    });

    document.getElementById('downloadCsv').addEventListener('click', () => {
      const csv = Papa.unparse(csvData);
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'edited.csv';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      document.getElementById('exportMenu').classList.toggle('hidden');
    });

    document.getElementById('exportJson').addEventListener('click', () => {
      const json = JSON.stringify(csvData, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('exportXlsx').addEventListener('click', () => {
      const ws = XLSX.utils.json_to_sheet(csvData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
      XLSX.writeFile(wb, 'data.xlsx');
    });

    document.getElementById('exportPdf').addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const headers = Object.keys(csvData[0]);
      const rows = csvData.map(row => headers.map(h => row[h]));
      doc.autoTable({ head: [headers], body: rows });
      doc.save('data.pdf');
    });

    document.getElementById('toggleTheme').addEventListener('click', () => {
      document.getElementById('body').classList.toggle('dark-mode');
    });

    window.onload = loadFromLocal;
  </script>
</body>
</html>
