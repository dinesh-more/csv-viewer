<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Viewer & Editor</title>
  <meta name="description" content="Modern CSV Viewer and Editor - Upload, Edit, Export CSV files online.">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-3xl font-semibold text-center mb-6">CSV Viewer & Editor</h1>

    <div class="flex flex-col md:flex-row items-center gap-4 mb-6">
      <input type="file" id="csvFile" accept=".csv" class="block w-full md:w-auto p-2 border rounded" />
      <button id="downloadCsv" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Download CSV</button>
      <button id="exportJson" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Export as JSON</button>
    </div>

    <div id="tableContainer" class="overflow-x-auto bg-white shadow rounded p-4"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    let csvData = [];

    document.getElementById('csvFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          csvData = results.data;
          renderTable(csvData);
        }
      });
    });

    function renderTable(data) {
      if (!data.length) return;
      const headers = Object.keys(data[0]);
      let html = '<table class="min-w-full border">';
      html += '<thead><tr>' + headers.map(h => `<th class="border p-2 bg-gray-100">${h}</th>`).join('') + '</tr></thead>';
      html += '<tbody>';
      data.forEach((row, rowIndex) => {
        html += '<tr>' + headers.map(h => `<td contenteditable="true" data-row="${rowIndex}" data-key="${h}" class="border p-2">${row[h] || ''}</td>`).join('') + '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('tableContainer').innerHTML = html;

      document.querySelectorAll('td[contenteditable=true]').forEach(td => {
        td.addEventListener('input', (e) => {
          const row = e.target.getAttribute('data-row');
          const key = e.target.getAttribute('data-key');
          csvData[row][key] = e.target.textContent;
        });
      });
    }

    document.getElementById('downloadCsv').addEventListener('click', () => {
      const csv = Papa.unparse(csvData);
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'edited.csv';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('exportJson').addEventListener('click', () => {
      const json = JSON.stringify(csvData, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data.json';
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
